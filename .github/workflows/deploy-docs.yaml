name: Deploy Documentation

on:
  push:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: write
  deployments: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Generate CI Bot Token
        id: app-token
        env:
          APP_ID: ${{ secrets.CI_BOT_APP_ID || secrets.CI_APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.CI_BOT_APP_PRIVATE_KEY || secrets.CI_APP_PRIVATE_KEY }}
        if: ${{ env.APP_ID != '' && env.APP_PRIVATE_KEY != '' }}
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1.12.0
        with:
          app-id: ${{ env.APP_ID }}
          private-key: ${{ env.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          token: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}

      - name: Setup PNPM Environment
        uses: ./.github/actions/setup-pnpm-env
        with:
          node-version: 22
          frozen-lockfile: 'false'
          filter: '@tupynambalucas-dev/corporate-portal...'

      - name: Generate Global Documents
        run: |
          pnpm portal:generate:changelog
          pnpm portal:generate:roadmap

      - name: Commit and Push Compiled Documents
        run: |
          git config --global user.name "tupynambalucas-ci-bot[bot]"
          git config --global user.email "5650100+tupynambalucas-ci-bot[bot]@users.noreply.github.com"
          git add CHANGELOG.md ROADMAP.md || true
          if git diff --staged --quiet; then
            echo "No changes to CHANGELOG.md or ROADMAP.md"
          else
            git commit -m "docs: update root CHANGELOG.md and ROADMAP.md [skip ci]"
            git push
          fi

      - name: Build documentation
        run: pnpm portal:build
        env:
          CLOUDFLARE_R2_ASSETS_PUBLIC_URL: ${{ secrets.CLOUDFLARE_R2_ASSETS_PUBLIC_URL }}

      - name: Idempotent Deploy to Cloudflare Pages
        uses: ./.github/actions/deploy-cloudflare-pages
        with:
          api_token: ${{ secrets.CLOUDFLARE_PAGES_API_TOKEN }}
          account_id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          project_name: ${{ vars.CLOUDFLARE_PAGES_PROJECT_DOCS_NAME || 'docs' }}
          directory: apps/portal/build
          production_branch: main
          custom_domain: 'docs.tupynambalucas.dev'
